name: Notify PR Failure

on:
  workflow_run:
    workflows:
      - Swift Package
    types:
      - completed

permissions: {}

jobs:
  notify_pr_failure:
    name: Notify PR Failure
    if: >-
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'failure'
      }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on failed PR
        uses: actions/github-script@v8
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const pullRequest = workflowRun.pull_requests[0];
            if (!pullRequest) {
              core.info('No PR context; skipping comment.');
              return;
            }

            const body = [
              `@${workflowRun.actor.login} CI가 실패했습니다.`,
              '',
              `- Workflow: ${workflowRun.name}`,
              `- Branch: ${workflowRun.head_branch}`,
              `- Commit: ${workflowRun.head_sha}`,
              `- Run: ${workflowRun.html_url}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              body,
            });
