name: Swift Package

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Swift Build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show environment
        run: |
          swift --version
          xcodebuild -version
          sw_vers

      - name: Check whitespace
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" 2>&1 | tee whitespace.log
          checkStatus=${PIPESTATUS[0]}
          set -e
          exit "$checkStatus"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          set +e
          swift build 2>&1 | tee build.log
          buildStatus=${PIPESTATUS[0]}
          set -e
          exit "$buildStatus"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: |
            whitespace.log
            build.log
          if-no-files-found: ignore

  test:
    name: Swift Test
    needs: build
    if: ${{ needs.build.result == 'success' }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/test.yml
    with:
      checkout_sha: ${{ github.sha }}
      pr_number: ${{ github.event.pull_request.number }}
      pr_actor: ${{ github.actor }}
      pr_head_ref: ${{ github.event.pull_request.head.ref }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}

  notify_pr_failure:
    name: Notify PR Failure (Build)
    needs: build
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download build logs
        uses: actions/download-artifact@v7
        with:
          name: build-log
          path: artifacts
        continue-on-error: true

      - name: Comment on failed PR
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              core.info('No PR context; skipping comment.');
              return;
            }

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            let body = [
              `@${context.actor} build CI가 실패했습니다.`,
              '',
              `- Workflow: ${context.workflow}`,
              `- Branch: ${pullRequest.head.ref}`,
              `- Commit: ${pullRequest.head.sha}`,
              `- Run: ${runUrl}`,
            ].join('\n');

            const logPaths = [
              'artifacts/whitespace.log',
              'artifacts/build.log',
            ];
            const availableLogs = logPaths.filter((path) => fs.existsSync(path));
            if (0 < availableLogs.length) {
              const lines = availableLogs.flatMap((path) =>
                fs.readFileSync(path, 'utf8').split(/\r?\n/)
              );
              const errorLines = lines.filter((line) =>
                /error:|fatal error:|trailing whitespace|space before tab/i.test(line)
              );
              const trimmedLines = errorLines.slice(0, 30);
              if (0 < trimmedLines.length) {
                body += '\n\n### 오류 요약\n```\n' + trimmedLines.join('\n') + '\n```';
              } else {
                body += '\n\n### 오류 요약\n로그에서 오류 줄을 찾지 못했습니다.';
              }
            } else {
              body += '\n\n### 오류 요약\nbuild log를 찾지 못했습니다.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest.number,
              body,
            });
