name: Test

on:
  workflow_call:
    inputs:
      checkout_sha:
        required: true
        type: string
      pr_number:
        required: true
        type: number
      pr_actor:
        required: true
        type: string
      pr_head_ref:
        required: true
        type: string
      pr_head_sha:
        required: true
        type: string

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Swift Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_sha }}
          persist-credentials: false

      - name: Swift Version
        run: swift --version

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          set +e
          swift test 2>&1 | tee test.log
          testStatus=${PIPESTATUS[0]}
          set -e
          exit "$testStatus"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log
          path: test.log
          if-no-files-found: ignore

  notify_pr_failure:
    name: Notify PR Failure (Test)
    needs: test
    if: ${{ always() && needs.test.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download test log
        uses: actions/download-artifact@v7
        with:
          name: test-log
          path: artifacts
        continue-on-error: true

      - name: Comment on failed PR
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_ACTOR: ${{ inputs.pr_actor }}
          PR_HEAD_REF: ${{ inputs.pr_head_ref }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            let body = [
              `@${process.env.PR_ACTOR} test CI가 실패했습니다.`,
              '',
              `- Workflow: ${context.workflow}`,
              `- Branch: ${process.env.PR_HEAD_REF}`,
              `- Commit: ${process.env.PR_HEAD_SHA}`,
              `- Run: ${runUrl}`,
            ].join('\n');

            const logPath = 'artifacts/test.log';
            if (fs.existsSync(logPath)) {
              const lines = fs.readFileSync(logPath, 'utf8').split(/\r?\n/);
              const errorLines = lines.filter((line) =>
                /error:|fatal error:|failed/i.test(line)
              );
              const trimmedLines = errorLines.slice(0, 30);
              if (0 < trimmedLines.length) {
                body += '\n\n### 오류 요약\n```\n' + trimmedLines.join('\n') + '\n```';
              } else {
                body += '\n\n### 오류 요약\n로그에서 오류 줄을 찾지 못했습니다.';
              }
            } else {
              body += '\n\n### 오류 요약\ntest.log를 찾지 못했습니다.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });
